[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costguard"
version = "0.1.0"
description = "A Terraform Azure cost impact guardrail"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
terminal = ["rich>=13"]
test = ["pytest>=8"]

[project.scripts]
costguard = "costguard.cli:main"
costguard-gui = "costguard.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: optional live Azure Retail Prices API test"]
addopts = "-m 'not network'"
